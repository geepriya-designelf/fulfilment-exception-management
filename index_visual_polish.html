<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fulfillment Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
:root{
  --background:#F7F7F5;--foreground:#21201F;--card:#FFFFFF;
  --primary:#21201F;--primary-foreground:#F7F7F5;
  --secondary:#EEEEEC;--muted:#E3E3E3;--muted-foreground:#6B6B6B;
  --accent:#BC5A28;--accent-foreground:#FFFFFF;--accent-tint:#FDEEE6;--accent-hover:#A64E22;--accent-ink:#A64E22;
  --border:#D9D9D9;--ring:#BC5A28;--radius:2px;--ink-2:#4D4C4A;
  --success-fg:#2D822B;--success-bg:#EAF4EC;
  --warning-fg:#606060;--warning-bg:#FDF4E3;
  --error-fg:#AF3535;--error-bg:#FDEEEC;
  --rec-fg:#2E6A44;--rec-bg:#E4EFE6;--rec-solid:#3E7D55;
  --risk-fg:#835207;--risk-bg:#F6EBD6;--risk-solid:#C08A2E;
  --inv-fg:#2D5673;--inv-bg:#E3ECF2;--inv-solid:#4B7294;
  --blk-fg:#45423C;--blk-bg:#E7E3DB;--blk-solid:#6E6A62;
  --esc-fg:#9B2F1C;--esc-bg:#F6E1DB;--esc-solid:#B5452F;
  --res-fg:#55524C;--res-solid:#BDB7AB;
  --lane-needs:var(--accent);--lane-waiting:var(--risk-solid);--lane-motion:var(--inv-solid);--lane-verified:var(--rec-solid);
  --step-todo:#E3E3E3;
  --panel-open:420px;
  --serif:"Fraunces",Georgia,serif;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#D9D9D9 transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-thumb{background:#D9D9D9;border-radius:3px}
html,body{margin:0;height:100%}
::selection{background:var(--accent-tint);color:var(--foreground)}
input,textarea{caret-color:var(--accent)}
body{background:var(--background);color:var(--foreground);font:400 13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.mono{font-family:var(--mono);font-feature-settings:"tnum"}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block;flex:none}
.ic{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.mark{color:var(--accent)}
.mark path{fill:none;stroke:currentColor;stroke-width:1.3}
.mark circle{fill:currentColor}
.label{font:500 11px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground)}
.cap{font-size:12px;color:var(--muted-foreground);line-height:1.4}
.link{color:var(--foreground);text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;font-weight:500;display:inline}
.link:hover{text-decoration-color:var(--foreground)}

/* buttons */
.btn{height:36px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;letter-spacing:.02em;white-space:nowrap;color:var(--foreground);transition:background .12s,border-color .12s,color .12s}
.btn:hover{border-color:var(--muted-foreground)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-foreground)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--secondary);border-color:transparent}
.btn-destructive{background:var(--error-fg);border-color:var(--error-fg);color:#fff}
.btn-destructive:hover{background:#962C2C}
.btn-inv{background:var(--foreground);border-color:var(--foreground);color:#fff}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px}
.btn-lg{height:44px;padding:0 18px;font-size:14px}
.btn-icon{width:32px;padding:0}
.btn-sm.btn-icon{width:28px}
.btn-full{width:100%}
.btn .count{font:500 11px/1 var(--mono);background:var(--foreground);color:#fff;border-radius:var(--radius);padding:3px 5px}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* pills & badges */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--radius);font-size:12px;font-weight:500;white-space:nowrap;line-height:1}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.sm{height:20px;font-size:11.5px}
.p-rec{color:var(--rec-fg);background:var(--rec-bg)}
.p-risk{color:var(--risk-fg);background:var(--risk-bg)}
.p-inv{color:var(--inv-fg);background:var(--inv-bg)}
.p-blk{color:var(--blk-fg);background:var(--blk-bg)}
.p-esc{color:var(--esc-fg);background:var(--esc-bg)}
.p-res{color:var(--res-fg);background:transparent;box-shadow:inset 0 0 0 1px var(--border)}
.p-ai{color:var(--accent-ink);background:var(--accent-tint)}
.badge{font:500 10.5px/1 var(--mono);border-radius:var(--radius);padding:3px 5px;letter-spacing:.02em;white-space:nowrap}
.b-new{color:var(--risk-fg);background:var(--risk-bg)}
.b-vip{color:#fff;background:var(--foreground)}
.b-rec{color:var(--accent-ink);background:var(--accent-tint)}
.src{font:400 11px/1 var(--mono);color:var(--ink-2);background:var(--secondary);border-radius:var(--radius);padding:3px 6px;white-space:nowrap;justify-self:start}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--secondary);color:var(--ink-2);font:500 10px/1 var(--serif);flex:none;width:24px;height:24px}
.av.me{background:var(--foreground);color:#fff}
.av.s20{width:20px;height:20px;font-size:9px}
.av.s28{width:28px;height:28px;font-size:11px}
.av.none{background:transparent;border:1px dashed #8A8A8A;color:#7A7A7A}

/* shell */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--background)}
.top{height:56px;flex:none;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:28px;padding:0 20px;position:relative;z-index:30}
.wordmark{font:500 20px/1 var(--serif);white-space:nowrap;text-decoration:none}
.nav{display:flex;gap:18px;align-self:stretch}
.nav button{font-size:13px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px;white-space:nowrap;padding:0 1px}
.nav button:hover{color:var(--foreground)}
.nav button[aria-current="page"]{color:var(--foreground);font-weight:500;box-shadow:inset 0 -1.5px 0 var(--foreground)}
.nbadge{font:500 10.5px/1 var(--mono);padding:3px 5px;border-radius:var(--radius);background:var(--secondary);color:var(--ink-2)}
.nbadge.hot{background:var(--accent-tint);color:var(--accent)}
.nbadge.flash{animation:bflash .9s ease-out}
@keyframes bflash{50%{background:var(--accent);color:#fff}}
.search{flex:1;max-width:420px;height:36px;border:1px solid var(--border);border-radius:var(--radius);background:var(--background);display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;color:var(--muted-foreground);min-width:140px}
.search:focus-within{border-color:var(--muted-foreground)}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;color:var(--foreground)}
.search input::placeholder{color:var(--muted-foreground)}
kbd{font:400 11px/1 var(--mono);border:1px solid var(--border);border-radius:var(--radius);padding:3px 5px;color:var(--muted-foreground);background:var(--card)}
.tright{margin-left:auto;display:flex;gap:16px;align-items:center;white-space:nowrap}
.clock{font-size:12px;color:var(--ink-2)}
.clock .paused{color:var(--risk-fg)}
.menu{position:absolute;right:16px;top:52px;width:260px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:6px;z-index:40}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--border);margin-bottom:4px}
.menu .who b{display:block;font-weight:600}
.menu .mi{display:flex;width:100%;padding:8px 10px;border-radius:var(--radius);font-size:13px;justify-content:space-between;align-items:center}
.menu .mi:hover{background:var(--secondary)}
.bodyg{flex:1;min-height:0;height:calc(100vh - 56px);display:grid;grid-template-columns:minmax(0,1fr) var(--panel-w);transition:grid-template-columns .2s ease-out;position:relative}
.app.p-open{--panel-w:var(--panel-open)}
.app.p-closed{--panel-w:56px}
.main{overflow:auto;min-width:0;padding:24px 28px;display:flex;flex-direction:column;gap:20px}
.main > *{flex-shrink:0}

/* hub */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{height:36px;padding:0 8px 0 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.fchip:hover{border-color:var(--muted-foreground)}
.fchip .rg{font-size:11px;color:var(--muted-foreground);font-weight:400}
.fchip .ct{font:500 11px/1 var(--mono);padding:3px 5px;border-radius:var(--radius);background:var(--secondary);color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--foreground);border-color:var(--foreground);color:#fff}
.fchip[aria-pressed="true"] .rg{color:#C9C9C9}
.fchip[aria-pressed="true"] .ct{background:#3A3937;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .val{font:300 30px/1.1 var(--serif);font-feature-settings:"tnum"}
.stat .d{font-size:12px;color:var(--muted-foreground)}
.stat .d.warn{color:var(--warning-fg)}
.stat .d.good{color:var(--success-fg)}

/* recoverability bar */
.rbar-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.rbar{display:flex;gap:2px;height:8px}
.rbar span{border-radius:1px;transition:flex-grow .4s ease-out}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend .it{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;display:inline-block}
.legend b{font:500 12px var(--mono);color:var(--foreground)}

/* toolbar + filter */
.toolbar{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.selw{position:relative;display:inline-flex;align-items:center;height:28px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);font-size:12.5px}
.selw .lb{padding-left:10px;color:var(--muted-foreground)}
.selw select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-weight:500;outline:none;cursor:pointer;padding:0 28px 0 6px;height:100%}
.selw::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.3px solid var(--ink-2);border-bottom:1.3px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.selw:focus-within{outline:2px solid var(--ring);outline-offset:2px}
.tag{height:28px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:0 8px 0 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.tag:hover{border-color:var(--muted-foreground)}
.tag .x{color:var(--muted-foreground);font-size:14px;line-height:1}
.rcount{margin-left:auto;font-size:12px;color:var(--muted-foreground)}
.fpop{position:absolute;left:0;top:36px;width:620px;max-width:calc(100vw - 40px);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;z-index:20}
.fsec .label{margin-bottom:8px}
.fsec .opts{display:flex;flex-wrap:wrap;gap:6px}
.tchip{height:28px;border-radius:var(--radius);padding:0 10px;font-size:12.5px;border:1px solid var(--border);background:var(--card);white-space:nowrap}
.tchip:hover{border-color:var(--muted-foreground)}
.tchip[aria-pressed="true"]{background:var(--foreground);border-color:var(--foreground);color:#fff}
.ffoot{grid-column:1/-1;border-top:1px solid var(--border);padding-top:12px;display:flex;align-items:center;gap:8px}
.ffoot .cap{flex:1}

/* table */
.tbl{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:minmax(0,1fr) 56px;border-bottom:1px solid var(--border);position:relative;box-sizing:border-box}
.line:last-child{border-bottom:0}
.line.z{background:#FBFBFA}
.line.row:hover{background:var(--secondary)}
.line.sel,.line.sel:hover{background:var(--accent-tint);box-shadow:inset 3px 0 0 var(--accent)}
.line.raised{z-index:10}
.line.flash{animation:rflash .6s ease-out}
@keyframes rflash{from{background:var(--accent-tint)}}
.cols{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,.9fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,1fr) minmax(0,1.1fr);gap:12px;padding:12px 14px;text-align:left;font-size:13px;width:100%;align-items:start;box-sizing:border-box}
.head{background:var(--secondary)}
.head .cols{padding:0 14px}
.th{display:flex;align-items:center;min-height:40px;padding-block:6px;font:500 11px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);text-align:left}
.th:hover{color:var(--foreground)}
.th .g{font-family:var(--mono);letter-spacing:0;font-size:11px;margin-left:4px;white-space:nowrap}
.th[aria-sort="ascending"],.th[aria-sort="descending"]{color:var(--foreground)}
.head .ocol{display:flex;align-items:center}
.head .ocol .th{letter-spacing:.02em;gap:2px}
.cell .pill{white-space:normal;height:auto;min-height:22px;padding:4px 8px;line-height:1.25;max-width:100%}
.cell{min-width:0}
.cell .v{color:var(--ink-2)}
.cell .num{font:400 14px/1.35 var(--mono);font-feature-settings:"tnum";color:var(--foreground);white-space:nowrap}
.cell .c{font-size:12px;color:var(--muted-foreground);line-height:1.4;margin-top:1px}
.cell .c.urgent{color:var(--warning-fg);font-weight:500}
.t1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rt{font-weight:600;font-size:13.5px;line-height:1.3;color:var(--foreground)}
.item{font-size:12.5px;color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idl{font-size:11px;color:var(--muted-foreground);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocell{display:flex;align-items:flex-start;justify-content:flex-start;padding:12px 0 0 0}
.obtn{position:relative;border-radius:50%}
.obtn .tip{position:absolute;right:0;top:calc(100% + 6px);background:var(--foreground);color:#fff;font:400 11.5px var(--sans);padding:5px 8px;border-radius:var(--radius);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:15}
.obtn:hover .tip,.obtn:focus-visible .tip{opacity:1}
.obtn:hover .av.none{border-color:var(--foreground);color:var(--foreground)}
.gh{background:var(--background);padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gh .label{color:var(--foreground)}
.gh .n{font:400 11.5px var(--mono);color:var(--muted-foreground)}
.gh .note{font:italic 400 13px/1.3 var(--serif);color:var(--ink-2);margin-left:auto;display:inline-flex;gap:5px;align-items:center}
.rstrip{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted-foreground);margin-top:-8px}
.rstrip b{color:var(--ink-2);font-weight:500}
.empty{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.empty h3{margin:0;font:400 16px var(--serif)}
.empty p{margin:0;font-size:13px;color:var(--muted-foreground)}

/* owner picker */
.opop{position:absolute;right:8px;top:calc(100% - 8px);width:280px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:8px;z-index:30}
.opop .oh{padding:4px 6px 8px;display:flex;flex-direction:column;gap:3px}
.opop .oh .label{color:var(--foreground)}
.opt{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center;width:100%;padding:7px 6px;border-radius:var(--radius)}
.opt:hover{background:var(--secondary)}
.opt.cur{background:var(--accent-tint)}
.opt .on{font-size:13px;font-weight:500;line-height:1.3}
.opt .orole{font-size:11.5px;color:var(--muted-foreground);line-height:1.3}

/* follow-through board */
.bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.bstats{display:grid;grid-template-columns:repeat(4,auto);gap:36px}
.bctl{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex}
.seg .btn{border-radius:0}
.seg .btn:first-child{border-radius:var(--radius) 0 0 var(--radius)}
.seg .btn:last-child{border-radius:0 var(--radius) var(--radius) 0;margin-left:-1px}
.seg .btn[aria-pressed="true"]{background:var(--foreground);border-color:var(--foreground);color:#fff;position:relative;z-index:1}
.stall{background:var(--secondary);border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font:400 15px/1.45 var(--serif)}
.stall .mark{margin-top:4px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;flex:1;min-height:420px}
.lane{display:flex;flex-direction:column;min-height:0;min-width:0}
.lane-h{padding-bottom:8px;border-bottom:1.5px solid;display:flex;flex-direction:column;gap:2px}
.lane-h .t{display:flex;justify-content:space-between;align-items:baseline}
.lane-h .label{color:var(--foreground)}
.lane-h .n{font:500 12px var(--mono)}
.lane-h .cap{font-size:11.5px}
.lane-b{flex:1;overflow:auto;padding:10px 0 4px;display:flex;flex-direction:column;gap:10px}
.lane-empty{border:1px dashed var(--border);border-radius:var(--radius);padding:16px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.lane-empty b{display:block;font:400 14px var(--serif)}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:9px;transition:border-color .12s,opacity .2s}
.fcard:hover{border-color:var(--muted-foreground)}
.fcard.sel{border-color:var(--accent);background:var(--accent-tint);box-shadow:inset 3px 0 0 var(--accent)}
.fcard.flash{animation:cflash .6s ease-out}
@keyframes cflash{from{background:var(--accent-tint)}to{background:var(--card)}}
.fcard .ftop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fcard .fid{font:400 11px var(--mono);color:var(--muted-foreground)}
.fcard .fh{font:400 16px/1.3 var(--serif);text-align:left;width:100%}
.fcard .fh:hover{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps i{height:4px;border-radius:1px;background:var(--step-todo)}
.steps i.done{background:var(--rec-solid)}
.steps i.cur{background:var(--risk-solid)}
.steps i.cur.you{background:var(--accent)}
.fmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.fmeta .who{display:flex;align-items:center;gap:6px;min-width:0}
.fmeta .due{font:400 12px var(--mono)}
.fmeta .due.soon{color:var(--risk-fg)}
.fnote{font-size:12px;background:var(--background);padding:6px 8px;border-radius:var(--radius);color:var(--ink-2)}
.tags{display:flex;gap:6px;flex-wrap:wrap}

/* copilot */
.cp{display:flex;flex-direction:column;min-height:0;min-width:0;border-left:1px solid var(--border);background:var(--card);overflow:hidden}
.cp-inner{display:flex;flex-direction:column;min-height:0;height:100%;width:var(--panel-open)}
.fade-in{animation:fadein .12s ease-out}
@keyframes fadein{from{opacity:0}}
.cph{padding:14px 20px;border-bottom:1px solid var(--border);flex:none;display:flex;flex-direction:column;gap:10px}
.cph .l1{display:flex;align-items:center;gap:8px}
.cph .l1 .nm{font-size:14px;font-weight:600}
.cph .l1 .tagline{font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cph .l1 .sp{margin-left:auto;display:flex;gap:4px;align-items:center}
.cph .l2{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-foreground);min-width:0}
.ctx{font:400 12px/1.3 var(--mono);background:var(--secondary);color:var(--foreground);border-radius:var(--radius);padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cpb{flex:1;min-height:0;overflow:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:18px}
.cpf{flex:none;border-top:1px solid var(--border);padding:12px 20px 16px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.schip{height:28px;border-radius:var(--radius);border:1px solid var(--border);padding:0 10px;font-size:12.5px;background:var(--card);white-space:nowrap}
.schip:hover{border-color:var(--muted-foreground);background:var(--background)}
.composer{height:38px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;padding:0 10px;gap:8px}
.composer:focus-within{border-color:var(--muted-foreground)}
.composer input{flex:1;border:0;outline:none;background:none;min-width:0}
.composer input::placeholder{color:var(--muted-foreground)}
.composer .mono{color:var(--muted-foreground);font-size:12px}
.voice{font:400 15px/1.45 var(--serif);color:var(--foreground);margin:0}
.ctxrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ruled{border-bottom:1px solid var(--border);padding-bottom:8px}
.bitem{display:grid;grid-template-columns:22px 1fr;gap:6px;width:100%;padding:14px 0;border-bottom:1px solid var(--border)}
.bitem:hover .bt{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.bitem .ix{font:400 12px/1.7 var(--mono);color:var(--muted-foreground)}
.bhd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.bt{font-size:14px;font-weight:600;line-height:1.35}
.dl{display:grid;grid-template-columns:92px 1fr;gap:5px 10px;font-size:12.5px;line-height:1.45;margin:0}
.dl dt{color:var(--muted-foreground);margin:0}
.dl dd{margin:0;color:var(--ink-2)}
.dl dd.nx{color:var(--foreground);font-weight:500}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;width:100%;text-align:left}
.hrow:hover span:first-child{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.facts{display:grid;grid-template-columns:1fr auto auto;gap:7px 12px;align-items:center;font-size:12.5px;margin-top:10px}
.facts .fl{color:var(--ink-2)}
.facts .fv{font:500 13px var(--mono);text-align:right;font-feature-settings:"tnum"}
.facts .fv.neg{color:var(--error-fg)}
.infer{background:var(--secondary);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.infer .ih{display:flex;justify-content:space-between;align-items:center;gap:8px}
.infer .ih .label{display:flex;gap:6px;align-items:center;color:var(--foreground)}
.conf{font-size:12px;color:var(--ink-2)}
.rcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.rcard .rl{display:flex;align-items:center;gap:6px}
.rcard .rl .label{color:var(--foreground)}
.hl{font-size:15px;font-weight:600;line-height:1.4;margin:0}
.imp{font-size:12.5px;color:var(--ink-2)}
.brow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.drow{display:flex;flex-wrap:wrap;gap:4px;border-top:1px solid var(--border);padding-top:10px}
.drow .btn[aria-expanded="true"]{background:var(--secondary);color:var(--foreground)}
.reasons{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.ok{background:var(--success-bg);color:var(--success-fg);font-size:12.5px;border-radius:var(--radius);padding:10px 12px;line-height:1.5}
.ok .link{color:var(--success-fg);text-decoration-color:currentColor}
.sect{display:flex;flex-direction:column;gap:8px}
.gt{width:100%;border-collapse:collapse;font-size:12px}
.gt th{text-align:left;font:500 10.5px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);padding:6px 6px 6px 0;border-bottom:1px solid var(--border)}
.gt td{padding:8px 6px 8px 0;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink-2)}
.gt td b{color:var(--foreground);font-weight:500}
.orow{padding:10px 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.orow .ot{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.orow .ot .tt{font-size:13px;font-weight:500;line-height:1.4}
.meta3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px}
.meta3 .k{color:var(--muted-foreground);font-size:11px}
.meta3 .v{color:var(--ink-2)}
.whycard{border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px}
.whycard ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.whycard .wl{font-size:12px;font-weight:600}
.dcard{background:var(--card);border:1px solid var(--foreground);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px}
.dcard .dh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.dcard .dh .label{color:var(--foreground)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);padding:3px 0;cursor:pointer}
.chk input{margin:2px 0 0;accent-color:var(--primary);width:14px;height:14px;flex:none}
.chk.dis{color:#9E9E9E;cursor:not-allowed}
.chk .sub{color:var(--muted-foreground)}
.dl2{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:12.5px;border-top:1px solid var(--border);padding-top:12px;margin:0}
.dl2 dt{color:var(--muted-foreground);margin:0}
.dl2 dd{margin:0;color:var(--foreground)}
.vcard{border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--border);transition:background .15s,box-shadow .15s}
.dot.checking{box-shadow:inset 0 0 0 1.5px var(--accent)}
.dot.done{background:var(--rec-solid);box-shadow:none}
.vrow.pending .t,.vrow.pending .ts{color:var(--muted-foreground)}
.vrow .ts{font:400 11.5px var(--mono);color:var(--muted-foreground)}
.vrow.checking .ts{color:var(--accent)}
.outcome{background:var(--success-bg);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:6px}
.outcome .label{color:var(--success-fg)}
.outcome .oh{font:400 18px/1.35 var(--serif);color:#1F4D2A;margin:0}
.outcome .os{font-size:12.5px;color:#2E4A38}
.srow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.srow .st{font-size:13px;font-weight:500}
.srow .sd{font-size:12px;color:var(--muted-foreground)}
.nothing{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.nothing .wl{font-size:12px;font-weight:600;color:var(--error-fg)}
.nothing ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
.thinking{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.thinking .mark{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.ta{width:100%;min-height:72px;resize:none;border:1px solid var(--border);border-radius:var(--radius);padding:9px 10px;font-size:13px;line-height:1.45;background:var(--card)}
.ta:focus{outline:2px solid var(--ring);outline-offset:0;border-color:transparent}
.convo{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border);padding-top:16px}
.msg-you{align-self:flex-end;max-width:88%;background:var(--secondary);border-radius:var(--radius);padding:8px 11px;font-size:13px}
.msg-you .label{display:block;margin-bottom:2px;font-size:10px}
.msg-ai{display:grid;grid-template-columns:16px 1fr;gap:8px}
.msg-ai .mark{margin-top:4px}
.msg-ai .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.msg-ai pre{margin:0;white-space:pre-wrap;font:400 12px/1.6 var(--mono);background:var(--background);border:1px solid var(--border);border-radius:var(--radius);padding:10px}

/* response panel */
.rhead{display:flex;flex-direction:column;gap:6px}
.rhead .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rtitle{font:400 20px/1.3 var(--serif);margin:0}
.sstrip{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:12.5px}
.sdot{width:8px;height:8px;border-radius:50%;flex:none}
.thread{display:flex;flex-direction:column;gap:12px}
.tmsg{display:grid;grid-template-columns:28px 1fr;gap:10px}
.tmsg .th2{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted-foreground)}
.tmsg .th2 b{color:var(--foreground);font-weight:600}
.tmsg p{margin:3px 0 0;font-size:13px;color:var(--foreground);line-height:1.5}
.tmsg .cap{margin-top:3px}
.means{background:var(--secondary);border-radius:var(--radius);padding:12px 14px;font:400 15px/1.45 var(--serif)}
.nstep{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);align-items:start;cursor:pointer}
.nstep input{margin:2px 0 0;accent-color:var(--primary);width:14px;height:14px}
.nstep .nt{font-size:13px;font-weight:500}
.nstep .nd{font-size:12px;color:var(--muted-foreground)}
.nstep .ns{font:400 11.5px var(--mono);color:var(--muted-foreground);white-space:nowrap}
.nstep .ns.done{color:var(--success-fg)}
.nstep .ns.checking{color:var(--accent)}
.tline{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:14px 64px 1fr;gap:8px;align-items:start;padding:6px 0;font-size:12.5px}
.ring{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--border);margin-top:3px;display:flex;align-items:center;justify-content:center}
.ring.done{border-color:var(--rec-solid);background:var(--rec-solid)}
.ring.now{border-color:var(--accent)}
.ring.now::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent)}
.tli .tm{font:400 11.5px var(--mono);color:var(--muted-foreground)}
.prog{height:6px;background:var(--step-todo);border-radius:1px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--inv-solid)}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500}
.sw{width:32px;height:18px;border-radius:9px;background:var(--muted);position:relative;transition:background .12s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .12s}
.switch[aria-checked="true"] .sw{background:var(--foreground)}
.switch[aria-checked="true"] .sw::after{left:16px}
.rfoot{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:14px}

/* rail */
.rail{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0;height:100%}
.rail .open{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 6px;border-radius:var(--radius)}
.rail .open:hover{background:var(--secondary)}
.rail .vt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;font-weight:600;letter-spacing:.04em}
.rbadge{min-width:18px;height:18px;border-radius:var(--radius);background:var(--secondary);color:var(--foreground);font:500 10.5px/18px var(--mono);text-align:center;padding:0 5px}
.rbadge.hot{background:var(--accent-tint);color:var(--accent)}

/* toast, modal, demo */
.toast{position:fixed;bottom:20px;right:calc(var(--panel-w, 0px) + 20px);z-index:80;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px;max-width:440px;animation:fadein .12s ease-out}
.toast .sdot{background:var(--accent)}
.toast.okay .sdot{background:var(--rec-solid)}
.scrim{position:fixed;inset:0;background:rgba(33,32,31,.32);z-index:90;display:flex;align-items:center;justify-content:center;animation:fadein .15s ease-out}
.modal{background:var(--card);border-radius:var(--radius);width:440px;max-width:calc(100vw - 32px);padding:22px;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font:400 20px var(--serif)}
.modal p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.modal .mb{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.demo{position:absolute;right:16px;top:52px;width:340px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;z-index:45;display:flex;flex-direction:column;gap:12px}
.demo .drow2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.demo .bl{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.demo .bl .drow2{padding:7px 0;border-bottom:1px solid var(--border)}

/* sign in */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:var(--background)}
.lcard{width:400px;max-width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;display:flex;flex-direction:column;gap:16px}
.lcard .wm{font:500 24px/1 var(--serif)}
.lcard .sub{font-size:14px;color:var(--muted-foreground);margin-top:-6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:500}
.field input{height:40px;border:1px solid var(--border);border-radius:var(--radius);padding:0 12px;background:var(--card);outline:none}
.field input:focus{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring)}
.field input.err{border-color:var(--error-fg)}
.field .em{font-size:12px;color:var(--error-fg)}
.ordiv{display:flex;align-items:center;gap:10px;font:500 11px var(--sans);letter-spacing:.08em;color:var(--muted-foreground)}
.ordiv::before,.ordiv::after{content:"";flex:1;height:1px;background:var(--border)}
.lfac{font:400 11px var(--mono);color:var(--muted-foreground)}

/* responsive */
@media (max-width:1439px){ :root{--panel-open:380px} .search{max-width:320px} .cols{grid-template-columns:minmax(0,2.1fr) minmax(0,.85fr) minmax(0,.75fr) minmax(0,.75fr) minmax(0,.9fr) minmax(0,1fr) minmax(0,1.3fr)} .th{letter-spacing:.06em} }
@media (max-width:1279px){
  :root{--panel-open:420px}
  .app.p-open{--panel-w:56px}
  .app.p-open .cp{position:absolute;right:0;top:0;bottom:0;width:420px;z-index:25;box-shadow:-12px 0 32px rgba(0,0,0,.12)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lane{max-height:520px}
}
@media (max-width:1023px){
  .nav .ph{display:none}
  .tblwrap{overflow-x:auto}
  .tbl{min-width:900px}
  .fpop{grid-template-columns:1fr}
  .top{gap:14px}
  .board{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

/* =====================================================================
   VISUAL POLISH LAYER · premium basics retail (Quince-like)
   Same behavior, new skin. Everything below overrides the base tokens.
   Principles: black is the human voice, slate navy is the Copilot,
   earth tones carry status, paper and linen carry the space.
   ===================================================================== */
:root{
  /* ground and ink */
  --background:#F5F3EF;          /* linen */
  --card:#FFFFFF;                /* paper */
  --paper-2:#FBFAF7;             /* Copilot panel */
  --foreground:#1B1A18;          /* ink */
  --ink-2:#45423D;
  --muted-foreground:#6A665F;    /* 5.1:1 on linen */
  --secondary:#EFECE6;
  --muted:#E6E2DA;
  --border:#E3DED5;
  --border-strong:#D3CDC2;
  --primary:#1B1A18;
  /* Copilot voice: slate navy (the human voice is ink) */
  --accent:#3A4A66;
  --accent-hover:#2C3950;
  --accent-ink:#3A4A66;
  --accent-tint:#EEF1F6;
  --ring:#3A4A66;
  /* status in earth tones, same meanings */
  --rec-fg:#2F5E3F;--rec-bg:#E7EFE8;--rec-solid:#5E8C69;
  --risk-fg:#7A5412;--risk-bg:#F4EAD7;--risk-solid:#C29A52;
  --inv-fg:#2C4A66;--inv-bg:#E5ECF2;--inv-solid:#6D8CAA;
  --blk-fg:#4A463F;--blk-bg:#ECE8E1;--blk-solid:#8E877B;
  --esc-fg:#8E2E22;--esc-bg:#F5E4DF;--esc-solid:#B5573F;
  --res-fg:#5A564F;--res-solid:#D5CFC4;
  --success-fg:#2F5E3F;--success-bg:#E7EFE8;
  --warning-fg:#7A5412;
  --error-fg:#9A3226;
  --lane-needs:var(--foreground);
  --step-todo:#E6E2DA;
  --radius:3px;
  /* type */
  --sans:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"Hanken Grotesk",ui-sans-serif,system-ui,sans-serif; /* data now sets in the sans with tabular figures */
  --code:"IBM Plex Mono",ui-monospace,monospace;              /* monospace kept only for IDs and source tags */
}
body{font:400 13.5px/1.5 var(--sans);letter-spacing:.005em;font-variant-numeric:tabular-nums}
.mono,.num,.fv,.val,.nbadge,.ct,.ts,.tm,.due,.n{font-variant-numeric:tabular-nums lining-nums}
.idl,.fid,.ctx,.src,kbd,.msg-ai pre{font-family:var(--code)}
::selection{background:#DCE2EC;color:var(--foreground)}

/* labels: quieter tracking, sentence rhythm */
.label{font:500 10.5px/1.2 var(--sans);letter-spacing:.1em;color:var(--muted-foreground)}

/* buttons: ink primary, paper secondary */
.btn{height:36px;border-color:var(--border-strong);font-weight:500;letter-spacing:.01em;border-radius:var(--radius)}
.btn:hover{border-color:var(--foreground)}
.btn-primary{background:var(--foreground);border-color:var(--foreground);color:#fff}
.btn-primary:hover{background:#000;border-color:#000}
.btn-ghost,.btn-ghost:hover{border-color:transparent}
.btn-ghost:hover{background:var(--secondary)}
.btn-sm{height:30px}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

/* top bar */
.top{height:60px;border-bottom-color:var(--border);gap:32px;padding:0 28px}
.wordmark{font:400 22px/1 var(--serif);letter-spacing:-.01em}
.nav{gap:22px}
.nav button{font-size:13.5px;color:var(--muted-foreground)}
.nav button[aria-current="page"]{color:var(--foreground);font-weight:500;box-shadow:inset 0 -2px 0 var(--foreground)}
.nbadge{font:500 11px/1 var(--sans);background:var(--secondary);color:var(--ink-2);padding:3px 6px;border-radius:10px}
.nbadge.hot{background:var(--foreground);color:#fff}
@keyframes bflash{50%{background:var(--accent);color:#fff}}
.search{height:38px;background:var(--background);border-color:transparent;border-radius:var(--radius)}
.search:focus-within{background:var(--card);border-color:var(--border-strong)}
.clock{font-size:12.5px;color:var(--muted-foreground)}

/* main column gets more air */
.main{padding:28px 32px 40px;gap:24px}

/* facility chips: quiet outlines, ink when chosen */
.fchip{height:34px;border-color:var(--border);background:transparent;font-weight:500;padding:0 10px 0 14px}
.fchip:hover{background:var(--card);border-color:var(--border-strong)}
.fchip .ct{font:500 11px/1 var(--sans);background:transparent;color:var(--muted-foreground);padding:0}
.fchip[aria-pressed="true"] .ct{background:transparent;color:#BDB8AE}

/* stat row: hairline rhythm, serif figures */
.stats{gap:0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.stat{padding:18px 20px 18px 0;gap:6px}

/* =====================================================================

   ===================================================================== */
function parseHash(){
  const h = (location.hash || '').replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  const seg = path.split('/').filter(Boolean);
  const q = new URLSearchParams(qs || '');
  if(seg[0] === 'login') return {name:'login', next:q.get('next')};
  if(seg[0] === 'exceptions') return seg[1] ? {name:'exceptions', id:decodeURIComponent(seg[1])} : {name:'exceptions'};
  if(seg[0] === 'follow-through') return seg[1] ? {name:'ft', id:decodeURIComponent(seg[1])} : {name:'ft'};
  if(seg[0] === 'hub') return {name:'hub'};
  return {name:'root'};
}
function nav(path){ if(location.hash !== '#' + path) location.hash = path; else onRoute(); }
function onRoute(){
  let r = parseHash();
  if(!S.signedIn && r.name !== 'login'){ const next = (location.hash || '').replace(/^#/, ''); location.replace('#/login?next=' + encodeURIComponent(!next || next === '/' ? '/hub' : next)); return; }
  if(S.signedIn && r.name === 'login'){ location.replace('#/hub'); return; }
  if(r.name === 'root'){ location.replace('#/hub'); return; }
  const prev = U.route;
  if(r.name === 'exceptions' && r.id && !rowById(r.id, true)) r = {name:'exceptions'};
  if(r.name === 'ft' && r.id && !ftGet(r.id)) r = {name:'ft'};
  const selChanged = r.id && (r.id !== prev.id || r.name !== prev.name);
  if(r.name === 'hub' || (r.name === 'exceptions' && !r.id)) S.ui.lastBase = r.name;
  if(selChanged){
    if(!S.ui.panelOpen){ S.ui.panelOpen = true; U.cpJust = true; }
    if(r.name === 'exceptions') S.disclosures = {orders:false, options:false, why:false};
    U.scrollSel = true; U.resetCp = true;
    U.thinking = {key:r.id, intro:true};
    setTimeout(() => { if(U.thinking && U.thinking.intro){ U.thinking = null; render(); } }, 450);
  }
  U.route = r; U.filterOpen = false; U.pickerFor = null;
  render();
}

function nudge(ftId){

  ft.nudgedAt = S.clock;

  toast(`Nudged ${PEOPLE[ft.counterpartId].name}`, {ok:true});
  save();
}
let runTimer = null;
function runPlan(){
  const ft = ftGet('FT-2045'); if(!ft || ft.lane !== 'needs_you') return;
  const t = stamp();
  moveLane(ft, 'in_motion');
  Object.assign(ft, {rec:'ai', label:'Plan running', steps:['done','done','current','todo'], runStartedAt:t});
  patchEx('EX-2045', {rec:'ai', statusLabel:'Executing'});
  const queue = ft.nextSteps.filter(s => s.on);
  ft.nextSteps.forEach(s => { if(!s.on) s.status = 'skipped'; });
  save(); render();
  let i = 0, phase = 0;
  clearInterval(runTimer);
  runTimer = setInterval(() => {
    const s = queue[i];
    if(!s){
      clearInterval(runTimer);
      const done = ft.nextSteps.filter(x => x.status === 'done').map(x => x.key);
      const parts = [];
      if(done.includes('ship')) parts.push('Reno is picking 44 sets');
      if(done.includes('move')) parts.push('16 customers were notified with a credit');
      if(done.includes('claim')) parts.push('the claim is filed');
      const list = parts.length > 1 ? parts.slice(0, -1).join(', ') + ', and ' + parts[parts.length - 1] : parts[0];
      ft.receipt = `Done. ${list ? list.charAt(0).toUpperCase() + list.slice(1) + '.' : 'Nothing ran.'} I’ll tell Rachel. Checked against the WMS, so this moved to Verified.`;
      ft.receiptShown = true;
      Object.assign(ft, {rec:'res', label:'Verified', steps:['done','done','done','done'], verifiedAt:S.clock});
      ft.timeline.push({at:S.clock, text:'Approved plan ran and verified', state:'done'});
      moveLane(ft, 'verified');
      patchEx('EX-2045', {rec:'res', statusLabel:'Plan verified', statusNote:'44 shipped from Reno, 16 moved to Oct 9', split:{res:60}, timeLeftOverride:`Done ${hm(S.clock)}`});
      announce('Approved plan verified.');
      save(); render(); return;
    }
    if(phase === 0){ s.status = 'checking'; phase = 1; }
    else { S.clock += 1; s.status = 'done'; s.doneAt = S.clock; phase = 0; i++; announce(s.title + ' · done'); }
    render();
  }, 650);
}
function closeFt(ftId){
  const ft = ftGet(ftId); if(!ft) return;
  ft.closed = true;
  const ex = rowById(ft.exceptionId, true);
  if(ex && !S.closed[ex.id]){
    S.closed[ex.id] = S.clock;
    S.closedLog.push({id:ex.id, text:`${ex.type} · ${facOf(ex.facility).name} FC`, at:S.clock, who:pname(ex.ownerId)});
  }
  toast(`${ft.exceptionId} closed · logged in Resolved today`, {ok:true});
  save();
  nav('/follow-through');
}
function undoReroute(){
  clearInterval(verifyTimer);
  S.ft = S.ft.filter(f => f.id !== 'FT-2041' && f.id !== 'FT-2041.1');
  S.extraRows = [];
  delete S.ex['EX-2041']; delete S.ex['EX-2041.1'];

  S.flow = freshFlow();

}

/* =====================================================================
   Copilot conversation: askCopilot(context, text)
   Keep this behind one function so a model can be swapped in later.
   ===================================================================== */
function ctxKey(){
  const r = U.route;
  if(r.name === 'ft') return r.id || 'ft';
  if(r.name === 'exceptions' && r.id) return r.id;
  return 'overview';
}
function conv(key){ return S.conv[key] || (S.conv[key] = []); }
function ask(text){
  text = String(text || '').trim(); if(!text) return;
  const key = ctxKey();
  conv(key).push({role:'you', text});
  U.thinking = {key};
  U.convScroll = true;
  render();
  setTimeout(() => {
    let a;
    try{ a = askCopilot(key, text.toLowerCase()); }catch(e){ console.warn(e); a = {text:'Something went wrong on my side. Try one of the suggestions below.'}; }
    U.thinking = null;
    const eff = a.effect; delete a.effect;
    conv(key).push(Object.assign({role:'ai'}, a));
    if(eff) eff();
    U.convScroll = true;
    announce(a.text);
    save(); render();
  }, 600);
}
const has = (t, ...ws) => ws.some(w => t.includes(w));
function askCopilot(key, t){
  const isEx = key.startsWith('EX-'), isFt = key.startsWith('FT-'), isFtCtx = key === 'ft' || isFt;
  const exId = isEx ? key : isFt ? (ftGet(key) || {}).exceptionId : null;
  if(has(t, 'toronto', 'other facilit') && exId === 'EX-2041')
    return {text:'Toronto, Bengaluru and Shenzhen hold stock but can’t ship US orders on time: cross border duties and transit break the Thu, Sep 24 promise. New York is the only facility that saves the date.', tags:['WMS 10:28'], effect:() => { if(S.flow.phase === 'summary') S.disclosures.options = true; }};
  if(has(t, 'waitlist') && exId === 'EX-2041')
    return {text:'5 of the 32 are waitlist customers: 3 in the central and East Coast group, 2 on the West Coast. All 5 are in the 26 I can save.', tags:['OMS'], effect:() => { if(S.flow.phase === 'summary') S.disclosures.orders = true; }};
  if(has(t, 'undo')){
    const ft = ftGet('FT-2041');
    if(ft && ft.undoUntil != null && ft.undoUntil > S.clock)
      return {text:`You can undo the reroute until New York finishes picking, about ${ft.undoUntil - S.clock} minutes from now. After that the parcels are packed.`, action:{label:'Undo reroute', act:'undoModal'}};
    return {text:'There’s nothing here I can undo right now.'};
  }
  if(has(t, 'changed', 'since 10', 'new') && key === 'overview')
    return {text:'Three new since 10:00: two shortages at Reno from the 10:22 stock count, and the Juniper Hotel order that came in at 10:26 larger than Reno’s stock.', tags:['Stock count','OMS']};
  if(has(t, 'likely cause', 'group') && !isFtCtx)
    return {text:'Grouped by likely cause. The two Reno shortages sit together: I think they’re one problem.', effect:() => { S.ui.groupBy = 'root'; S.ui.sort = null; }};
  if(has(t, 'mine', 'my ')){
    const n = allRows().filter(r => isOpen(r) && r.ownerId === 'you').length;
    return {text: n ? `${NUMW[n] || n} ${n === 1 ? 'is' : 'are'} yours. I’ve filtered the table to them.` : 'Nothing is assigned to you yet. The three unassigned ones due today are the best place to start.',
      effect:() => { if(n){ S.ui.filters = emptyFilters(); S.ui.filters.owner = ['me']; } }};
  }
  if(has(t, 'stalled', 'late', 'slow') && isFtCtx){
    const s = stalest();
    if(!s) return {text:'Nothing is stalled. Everything waiting on someone else is inside its normal window.'};
    const n = S.clock - s.waitingSince;
    const med = s.id === 'FT-2038' ? ' Their median is 18 minutes.' : s.id === 'FT-2045' ? ' Rachel usually answers within 30 minutes.' : s.id === 'FT-2041.1' ? ' Searches like this usually take 30 to 40 minutes.' : '';
    return {text:`${s.exceptionId} has waited longest: ${PEOPLE[s.counterpartId].name}, ${n} minutes so far.${med}`, effect:() => nav('/follow-through/' + s.id)};
  }
  if(has(t, 'due', 'before noon', 'deadline') && isFtCtx){
    const items = visibleFt().filter(f => f.lane !== 'verified' && f.dueAt != null && f.dueAt < 720).sort((a, b) => a.dueAt - b.dueAt);
    return {text: items.length ? 'Due before noon: ' + items.map(f => `${f.exceptionId} at ${hm(f.dueAt)}, ${f.title.charAt(0).toLowerCase() + f.title.slice(1)}`).join('; ') + '.' : 'Nothing in flight is due before noon.'};
  }
  if(has(t, 'summar', 'ops lead', 'standup')){
    const c = ftCounts(), s = stalest();
    const ver = visibleFt().filter(f => f.lane === 'verified').length;
    const lines = [`In flight: ${c.inFlight}`, `Needs you: ${c.needsYou}${c.needsYou ? ' · ' + visibleFt().filter(f => f.lane === 'needs_you').map(f => f.exceptionId).join(', ') : ''}`,
      `Stalled 20 min+: ${c.stalled}${s ? ` · longest wait ${s.exceptionId}, ${S.clock - s.waitingSince} min` : ''}`, `Verified today: ${ver}`, `Next deadline: ${c.next != null ? hm(c.next) : 'none'}`];
    return {text:'Here’s a five line summary you can paste.', pre:lines.join('\n'), copy:true};
  }
  if(has(t, 'draft', 'write', 'note to')){
    const who = has(t, 'rachel') ? 'rachel' : has(t, 'sofia', 'hotel') ? 'sofia' : has(t, 'dana') ? 'dana' : has(t, 'marco') ? 'marco' : has(t, 'mei') ? 'mei' : has(t, 'carrier') ? 'bc'
      : exId === 'EX-2045' ? 'rachel' : exId === 'EX-2049' ? 'sofia' : exId === 'EX-2036' ? 'marco' : exId === 'EX-2047' ? 'mei' : null;
    const drafts = {
      rachel: exId === 'EX-2045' && !S.acted['EX-2045'] ? GEN['EX-2045'].draft : 'Thanks Rachel. Running the plan now: 44 from Reno, 16 moved to Oct 9 with the credit. I’ll confirm once it’s verified.',
      sofia:HOTEL_DRAFT,
      dana:'Hi Dana, any luck in dock staging? The 6 picked short crewneck orders and 12 duvet orders are waiting on what you find.',
      marco:'Hi Marco, how is the carton check going on the Mulberry pillowcases? No rush before tomorrow, just keeping an eye on it.',
      mei:'Hi Mei, any word from customs on batch SZ-0922? Let me know if you need anything from me before tomorrow’s pickup.',
      bc:'Hello, following up on our request for 25 extra parcel slots on tomorrow’s 6:00 AM IST pickup at Bengaluru FC. Could you confirm?'
    };
    if(!who) return {text:'Who should the note go to? Try "draft a note to Rachel" or "draft a note to Dana".'};
    let send = null;
    if(who === 'rachel' && exId === 'EX-2045' && !S.acted['EX-2045'] && isEx) send = 'escalation.send';
    else if(who === 'rachel' && key === 'FT-2045') send = 'ft.reply';
    else if(who === 'sofia' && key === 'FT-2049' && ftGet('FT-2049').confirmedAt != null) send = 'ft.hotel';
    return {text:`Here’s a draft for ${PEOPLE[who].name}. Edit anything you like.${send ? '' : ' There’s no open request to send it through from here, so copy it where you need it.'}`, draft:drafts[who], send, copy:!send};
  }
  if(has(t, 'escalat') && exId === 'EX-2041')
    return {text:'This one doesn’t need escalating: the reroute is under the $250 line and inside your authority. If you’d rather hand it off, I can draft a note to Dana K., the Reno FC lead.', action:{label:'Draft a note to Dana', act:'ask', arg:'Draft a note to Dana'}};
  if(/\b(reroute|cancel|ship it|approve|book|refund|execute|send it)\b/.test(t)){
    return {text:'I can’t do that on my own, but here’s the decision ready for you.', effect:() => {
      if(exId === 'EX-2041' && S.flow.phase === 'summary'){ S.flow.option = 'A'; S.flow.phase = 'confirm'; U.resetCp = true; }
      else if(exId === 'EX-2045' && !S.acted['EX-2045'] && isEx){ S.reviewOpen['EX-2045'] = true; if(S.drafts.esc == null) S.drafts.esc = GEN['EX-2045'].draft; }
      else U.focusNext = '[data-primary]';
    }};
  }
  if(has(t, 'wait', 'do nothing', 'if i don')){
    if(exId === 'EX-2041') return {text:'If nobody acts, 32 orders miss today’s ship and their Thu delivery promise, including 5 waitlist customers who already waited 6 weeks. That’s about $320 in goodwill credits. Decide by 1:00 PM.'};
    const g = GEN[exId];
    if(g && g.nothing){ const r = rowById(exId, true); return {text:`If you wait: ${g.nothing.map(x => x.charAt(0).toLowerCase() + x.slice(1)).join(', and ')}. Decide by ${r ? r.decideBy : 'the deadline'}${r && r.mins > 0 && r.rec !== 'res' ? `, ${dur(r.mins)} from now` : ''}.`}; }
  }
  if(has(t, 'evidence', 'why', 'how do you know')){
    if(exId === 'EX-2041') return {text:'What I know: the 10:22 stock count found 26 where the WMS expected 64, and New York has 32 on hand. What I infer, with medium confidence: the gap is delivery RCV-7713, still sitting in dock staging with its putaway task open.', tags:['WMS','Stock count','Inbound PO'], effect:() => { if(S.flow.phase === 'summary') S.disclosures.why = true; }};
    if(exId === 'EX-2043' && has(t, 'hold', '12')) return {text:'Duvets ship as oversize parcels, so an air upgrade isn’t possible and ground from New York would land the 12 West Coast orders late anyway. Holding costs nothing, and if Dana finds the units by 11:30 all 12 ship from Reno on time.'};
    const g = GEN[exId];
    if(g) return {text:`What I know: ${g.facts.slice(0, 3).map(f => `${f[0].toLowerCase()} ${f[1]}`).join(', ')}. What I infer, with ${g.infer.conf} confidence: ${g.infer.text.charAt(0).toLowerCase() + g.infer.text.slice(1)}`, tags:[...new Set(g.facts.slice(0, 3).map(f => f[2]))]};
  }
  if(has(t, 'who else', 'related', 'same zone') && (exId === 'EX-2041' || exId === 'EX-2043')){
    const other = exId === 'EX-2041' ? 'EX-2043' : 'EX-2041';
    return {text: exId === 'EX-2041' ? 'EX-2043, the linen duvets, came from the same 10:22 stock count in the same storage area. Same likely cause.' : 'EX-2041, the cashmere crewnecks, came from the same 10:22 stock count in the same storage area. Same likely cause.', action:{label:`Open ${other}`, act:'select', arg:other}};
  }
  return {text:'I can explain an exception, compare options, draft a message or tell you what’s in flight. Try one of the suggestions below.'};

function sortRows(rows){

  return rows.slice().sort((a, b) => { const x = key(a), y = key(b); const c = x < y ? -1 : x > y ? 1 : 0; return s.dir === 'asc' ? c : -c; });

function renderTable(rows){
  if(!rows.length){
    return `<div class="empty"><h3>${allRows().some(isOpen) ? 'No exceptions match these filters' : 'Nothing needs you right now'}</h3><p>Try removing a filter, or clear them all.</p><button class="btn btn-sm" data-action="clearAll">Clear filters</button></div>`;
  }
  const s = S.ui.sort;
  const th = (k, l) => {
    const st = s && s.key === k ? (s.dir === 'asc' ? 'ascending' : 'descending') : 'none';
    const g = st === 'ascending' ? '↑' : st === 'descending' ? '↓' : '↕';
    return `<button class="th" data-action="sort" data-arg="${k}" aria-sort="${st}"><span>${l}<span class="g" aria-hidden="true">${g}</span></span></button>`;
  };
  const head = `<div class="line head"><div class="cols">${COLS.map(([k, l]) => th(k, l)).join('')}</div><div class="ocol">${th('owner', 'Owner')}</div></div>`;
  let body = '';
  if(s){
    body = `<div class="gh"><span class="label">Sorted</span><span class="n">click the header again to reverse or clear</span></div>` + sortRows(rows).map((r, i) => renderRow(r, i % 2)).join('');
  } else if(S.ui.groupBy === 'none'){
    body = rows.map((r, i) => renderRow(r, i % 2)).join('');
  } else {
    const g = GROUPS[S.ui.groupBy];
    body = g.list.map(([k, label, note]) => {
      const rs = rows.filter(r => g.get(r) === k);
      if(!rs.length) return '';
      return `<div class="gh"><span class="label">${label}</span><span class="n">${rs.length} exception${rs.length === 1 ? '' : 's'}</span>${note ? `<span class="note">${I.mark(11)}${note}</span>` : ''}</div>${rs.map((r, i) => renderRow(r, i % 2)).join('')}`;
    }).join('');
  }
  return `<div class="tblwrap"><div class="tbl" aria-label="Exceptions">${head}${body}</div></div>`;
}

   Render: Follow-through board
   ===================================================================== */
const LANES = [
  ['needs_you','Needs you','A reply came back and it’s your move','var(--lane-needs)'],
  ['waiting','Waiting on others','Sent, not yet answered','var(--lane-waiting)'],
  ['in_motion','In motion','Running, with a fallback armed','var(--lane-motion)'],
  ['verified','Verified today','Checked against the WMS, not assumed','var(--lane-verified)']
];
function stallLine(){
  const s = stalest(); if(!s) return '';
  const n = S.clock - s.waitingSince; if(n < 10) return '';
  let txt;
  if(s.id === 'FT-2038') txt = `The backup carrier in Bengaluru hasn’t confirmed in ${n} minutes. ${n > 20 ? 'That’s past their usual 18, so I’d nudge them now.' : 'At this pace it’s fine, but if nothing by 11:30 I’d call them.'}`;
  else txt = `${PEOPLE[s.counterpartId].name} hasn’t come back on ${s.exceptionId} in ${n} minutes. ${n > 20 ? 'I’d nudge.' : 'Still inside the normal window.'}`;
  return `<div class="stall">${I.mark(14)}<span>${txt}</span></div>`;
}
function waitingLine(f){
  if(f.lane === 'needs_you') return f.repliedAt != null ? `Replied ${hm(f.repliedAt)}` : 'Needs your call';
  if(f.lane === 'waiting') return `${PEOPLE[f.counterpartId].name} · ${Math.max(0, S.clock - f.waitingSince)} min`;
  if(f.lane === 'in_motion') return f.id === 'FT-2049' ? (f.fallback.armed ? 'Fallback armed' : 'Fallback off') : `Running since ${hm(f.runStartedAt || f.waitingSince)}`;
  if(f.kind === 'resolved') return `Closed ${hm(f.verifiedAt, false)}`;
  if(f.undoUntil != null && f.undoUntil > S.clock) return `Undo ~${f.undoUntil - S.clock} min`;
  return `Verified ${hm(f.verifiedAt)}`;
}
function renderCard(f){
  const sel = U.route.name === 'ft' && U.route.id === f.id;
  const you = f.lane === 'needs_you';

  let act = '';
  if(you) act = `<button class="btn btn-primary btn-sm" data-action="ftSelect" data-arg="${f.id}">Review and run</button>`;

function ctxText(m, c){

  if(r.name === 'ft'){
    if(!r.id) return `Follow-through · ${c.inFlight} in flight · ${c.needsYou} need${c.needsYou === 1 ? 's' : ''} you`;

    return `${f.exceptionId} · ${facOf(f.facility).name} FC · ${f.label}`;
  }
  if(r.name === 'exceptions' && r.id) return r.id === 'EX-2041' ? 'EX-2041 · SKU 4832 · Reno FC · 32 orders' : r.id;
  return `Hub · ${m.open} open exceptions · 5 facilities`;

  const r = U.route, k = ctxKey();
  if(r.name === 'ft'){
    if(!r.id) return ['What’s stalled?','What’s due before noon?','Summarize for the ops lead'];
    const f = ftGet(r.id);

  }

function stateStrip(f){

  else if(f.lane === 'waiting'){ color = 'var(--lane-waiting)'; text = `Sent ${hm(f.waitingSince)} · waiting on ${PEOPLE[f.counterpartId].name} · ${S.clock - f.waitingSince} min`; }
  else if(f.lane === 'in_motion'){ color = 'var(--lane-motion)'; text = f.id === 'FT-2049' ? `Running · fallback ${f.fallback.armed ? 'armed' : 'off'}` : `Running since ${hm(f.runStartedAt || f.waitingSince)}`; }
  else text = f.kind === 'resolved' ? `Closed ${hm(f.verifiedAt)}` : `Verified ${hm(f.verifiedAt)} · checked against the WMS`;

}
function timeline(items){

      <div class="sect"><span class="label">Undo</span><div class="ctxrow"><span class="cap">${undoLeft > 0 ? `Available until New York finishes picking · ~${undoLeft} min` : 'Picking finished · parcels are packed'}</span>${undoLeft > 0 ? `<button class="btn btn-ghost btn-sm" data-action="undoModal">Undo</button>` : ''}</div></div>
      <div><div class="label ruled">Still open from this exception</div>
        ${fu ? `<div class="srow"><div><div class="st">Dock staging search · EX-2041.1</div><div class="sd">6 orders · Dana K. · due 11:30 AM</div></div>${pill(fu.rec, fu.label, true)}</div>` : ''}
        <div class="srow"><div><div class="st">Customer notice</div><div class="sd">Not needed · promise date unchanged</div></div>${pill('blk', 'Skipped', true)}</div></div>`;

    secondary = fu && fu.lane === 'waiting' ? (fu.nudgedAt != null ? `<button class="btn" disabled>Nudged Dana K. ${hm(fu.nudgedAt)}</button>` : `<button class="btn" data-action="nudge" data-arg="FT-2041.1">Nudge Dana K.</button>`) : '';
  } else if(f.kind === 'resolved'){

/* =====================================================================
   Root render: full re-render, preserving focus, caret and scroll
   ===================================================================== */
const root = document.getElementById('app');
function focusKeyOf(el){
  if(!el || el === document.body) return null;
  if(el.dataset && el.dataset.draft) return `[data-draft="${CSS.escape(el.dataset.draft)}"]`;
  if(el.id) return '#' + el.id;
  if(el.dataset && el.dataset.action) return `[data-action="${el.dataset.action}"]${el.dataset.arg != null ? `[data-arg="${CSS.escape(el.dataset.arg)}"]` : ''}`;
  return null;
}
function render(){
  const act = document.activeElement;
  const fk = focusKeyOf(act);
  const selStart = act && typeof act.selectionStart === 'number' ? act.selectionStart : null;
  const mainEl = root.querySelector('.main'), cpb = root.querySelector('#cpb');
  const mainTop = mainEl ? mainEl.scrollTop : 0, cpTop = cpb ? cpb.scrollTop : 0;
  const laneTops = [...root.querySelectorAll('.lane-b')].map(x => x.scrollTop);
  if(U.route.name === 'login'){
    root.innerHTML = renderLogin() + renderToast();
  } else {
    const m = metrics(), c = ftCounts();
    const r = U.route.name;
    let main = '';
    if(r === 'hub') main = renderFacChips(m) + renderStats(m) + renderWork(m);
    else if(r === 'exceptions') main = renderWork(m);
    else if(r === 'ft') main = renderBoard();
    root.innerHTML = `<div class="app ${S.ui.panelOpen ? 'p-open' : 'p-closed'}">${renderTop(m, c)}
      <div class="bodyg"><main class="main" aria-label="${r === 'hub' ? 'Hub' : r === 'ft' ? 'Follow-through' : 'Exceptions'}">${main}</main>${renderCopilot(m, c)}</div>${renderToast()}</div>${renderModal()}`;
  }
  const nm = root.querySelector('.main'); if(nm) nm.scrollTop = mainTop;
  root.querySelectorAll('.lane-b').forEach((x, i) => { if(laneTops[i] != null) x.scrollTop = laneTops[i]; });
  const nc = root.querySelector('#cpb');
  if(nc){
    if(U.convScroll){ nc.scrollTop = nc.scrollHeight; U.convScroll = false; }
    else if(U.resetCp) nc.scrollTop = 0;
    else nc.scrollTop = cpTop;
  }
  U.resetCp = false; U.cpJust = false;
  const now = Date.now();
  for(const id in U.flash) if(U.flash[id] > now) delete U.flash[id];
  if(U.badgeFlash > now) U.badgeFlash = 0;
  if(U.scrollSel){ U.scrollSel = false; const el = root.querySelector('.line.sel, .fcard.sel'); if(el) el.scrollIntoView({block:'nearest'}); }
  let target = null;
  if(U.modal){ target = root.querySelector('.modal').contains(document.activeElement) ? null : root.querySelector('.modal .mb .btn:last-child'); if(!target && fk) target = root.querySelector('.modal ' + fk); }
  else if(U.focusNext){ target = root.querySelector(U.focusNext); U.focusNext = null; }
  if(!target && fk && !U.modal){ try{ target = root.querySelector(fk); }catch(e){} }
  if(target){
    target.focus({preventScroll:true});
    if(selStart != null && typeof target.setSelectionRange === 'function' && /^(TEXTAREA|INPUT)$/.test(target.tagName) && target.type !== 'checkbox' && target.type !== 'email'){ try{ target.setSelectionRange(selStart, selStart); }catch(e){} }
  }
}

function handle(action, arg, el, ev){
  switch(action){
    case 'sso': doSignIn('sso'); return;
    case 'go': U.menuOpen = false; nav(arg); return;
    case 'placeholder': toast('Not in this prototype'); return;
    case 'menu': U.menuOpen = !U.menuOpen; U.demoOpen = false; if(U.menuOpen) U.focusNext = '.menu .mi'; break;
    case 'demo': U.demoOpen = !U.demoOpen; U.menuOpen = false; break;
    case 'signOutModal': openModal('signout', root.querySelector('[data-action="menu"]')); break;
    case 'resetModal': openModal('reset', root.querySelector('[data-action="menu"]')); break;
    case 'modalCancel': closeModal(); break;
    case 'modalScrim': if(ev && ev.target === el){ closeModal(); break; } return;
    case 'confirmSignOut': U.modal = null; S.signedIn = false; save(); location.hash = '/login'; return;
    case 'confirmReset': U.modal = null; resetDemo(); return;
    case 'confirmUndo': U.modal = null; undoReroute(); return;
    case 'confirmFallback': {
      U.modal = null;
      const ft = ftGet('FT-2049');
      Object.assign(ft, {slipped:false, note:'Air freight approved · 200 towels arrive Fri', steps:['done','done','done','current']});
      ft.timeline.push({at:stamp(), text:'You approved 200 towels by air from New York', state:'done'});
      moveLane(ft, 'in_motion');
      toast('Air freight approved · sent to the ops lead', {ok:true});
      save(); break;
    }
    case 'pause': S.paused = !S.paused; save(); break;
    case 'fire': { const b = S.beats.find(x => x.id === arg); fireBeat(arg, b ? b.simAt : (BEATS[arg].simAt ? BEATS[arg].simAt() : null)); break; }
    case 'snapshot': U.demoOpen = false; loadSnapshot(); return;
    case 'toastClose': nextToast(); return;
    case 'toastReview': nav('/follow-through/' + arg); nextToast(); return;
    case 'scope':
      if(arg === 'all'){ S.ui.scope = 'all'; save(); break; }
      S.ui.scope = arg; save(); nav('/exceptions'); return;
    case 'clearScope': S.ui.scope = 'all'; U.focusNext = '[data-action="toggleFilters"]'; save(); break;
    case 'select': nav('/exceptions/' + arg); return;
    case 'ftSelect': nav('/follow-through/' + arg); return;
    case 'back': nav(U.route.name === 'ft' ? '/follow-through' : '/' + (S.ui.lastBase === 'hub' ? 'hub' : 'exceptions')); return;
    case 'openCp': S.ui.panelOpen = true; U.cpJust = true; U.focusNext = '[data-action="closeCp"]'; save(); break;
    case 'closeCp': S.ui.panelOpen = false; U.cpJust = true; U.focusNext = '[data-action="openCp"]'; save(); break;
    case 'toggleFilters': U.filterOpen = !U.filterOpen; U.pickerFor = null; if(U.filterOpen) U.focusNext = '.fpop .tchip'; break;
    case 'closeFilters': U.filterOpen = false; U.focusNext = '[data-action="toggleFilters"]'; break;
    case 'resetFilters': S.ui.filters = emptyFilters(); save(); break;
    case 'toggleFilter': { const [k, v] = arg.split(':'); const a = S.ui.filters[k]; const i = a.indexOf(v); i < 0 ? a.push(v) : a.splice(i, 1); save(); break; }
    case 'rmFilter': { const [k, v] = arg.split(':'); S.ui.filters[k] = S.ui.filters[k].filter(x => x !== v); U.focusNext = '[data-action="toggleFilters"]'; save(); break; }
    case 'clearAll': S.ui.filters = emptyFilters(); S.ui.scope = 'all'; U.focusNext = '[data-action="toggleFilters"]'; save(); break;
    case 'sort': {
      const s = S.ui.sort;
      S.ui.sort = !s || s.key !== arg ? {key:arg, dir:'asc'} : s.dir === 'asc' ? {key:arg, dir:'desc'} : null;
      save(); break;
    }
    case 'picker': U.pickerFor = U.pickerFor === arg ? null : arg; U.filterOpen = false; if(U.pickerFor) U.focusNext = '.opop .opt.cur, .opop .opt'; break;
    case 'assign': {
      const [id, who] = arg.split('|'); const ownerId = who || null;
      patchEx(id, {ownerId}); U.pickerFor = null;
      U.focusNext = `[data-action="picker"][data-arg="${id}"]`;
      toast(`${id} ${ownerId ? 'assigned to ' + (ownerId === 'you' ? 'you' : PEOPLE[ownerId].name) : 'unassigned'}`, {ok:true});
      save(); break;
    }
    case 'disc': S.disclosures[arg] = !S.disclosures[arg];
      if(S.disclosures[arg]) setTimeout(() => { const t = document.getElementById('d-' + arg); if(t) t.scrollIntoView({block:'nearest', behavior:'smooth'}); }, 0);
      save(); break;
    case 'accept': S.flow.option = 'A'; S.flow.phase = 'confirm'; U.resetCp = true; save(); break;
    case 'useOpt': S.flow.option = arg; S.flow.groups = {east:true, west:true}; S.flow.phase = 'confirm'; U.resetCp = true; save(); break;
    case 'backToSummary': S.flow.phase = 'summary'; save(); break;
    case 'execute': U.resetCp = true; executeReroute(false); break;
    case 'withdraw': S.flow = freshFlow(); delete S.ex['EX-2041']; save(); break;
    case 'undoModal': openModal('undo', el); break;
    case 'primary': {
      const g = GEN[arg];
      if(g.rec.action === 'follow') dispatch('follow', arg); else dispatch(g.rec.action);
      toast(`${arg} · tracking in Follow-through`, {ok:true});
      break;
    }
    case 'secondary': {
      const i = arg.indexOf('|'); const id = arg.slice(0, i), sa = arg.slice(i + 1);
      if(sa === 'review'){ S.reviewOpen[id] = true; if(S.drafts.esc == null) S.drafts.esc = GEN[id].draft; U.focusNext = '#ta-esc'; }
      else if(sa === 'picker'){ U.pickerFor = id; U.focusNext = '.opop .opt'; const row = root.querySelector(`[data-action="picker"][data-arg="${id}"]`); if(row) row.scrollIntoView({block:'nearest'}); }
      else if(sa === 'scrollOptions'){ setTimeout(() => { const t = document.getElementById('g-options'); if(t) t.scrollIntoView({block:'start', behavior:'smooth'}); }, 0); return; }
      else if(sa.startsWith('ask:')){ ask(sa.slice(4)); return; }
      break;
    }
    case 'sendEsc': dispatch('escalation.send', S.drafts.esc); toast('Escalation sent to Rachel M.', {ok:true}); break;
    case 'cancelReview': S.reviewOpen['EX-2045'] = false; U.focusNext = '[data-primary]'; break;
    case 'ask': ask(arg); return;
    case 'convSend': {
      const key = ctxKey(); const m = conv(key)[+arg]; const dk = `conv:${key}:${arg}`;
      const text = S.drafts[dk] != null ? S.drafts[dk] : m.draft;
      if(m.send === 'escalation.send'){ dispatch('escalation.send', text); toast('Escalation sent to Rachel M.', {ok:true}); }
      else if(m.send === 'ft.reply') ftReply(text);
      else if(m.send === 'ft.hotel') hotelUpdate(text);
      m.sent = hm(S.clock); save(); break;
    }
    case 'copy': {
      const key = ctxKey(); const m = conv(key)[+arg]; const dk = `conv:${key}:${arg}`;
      const text = m.pre || (S.drafts[dk] != null ? S.drafts[dk] : m.draft) || '';
      try{ navigator.clipboard.writeText(text).then(() => toast('Copied', {ok:true}), () => toast('Copy isn’t available here')); }catch(e){ toast('Copy isn’t available here'); }
      return;
    }
    case 'nudge': nudge(arg); break;
    case 'runPlan': runPlan(); return;
    case 'toggleReply': S.reviewOpen['FT-2045'] = !S.reviewOpen['FT-2045']; U.focusNext = S.reviewOpen['FT-2045'] ? '#ta-reply' : '[data-action="toggleReply"]'; break;
    case 'sendReply': ftReply(S.drafts.reply || ''); S.drafts.reply = ''; S.reviewOpen['FT-2045'] = false; break;
    case 'fallback': { const ft = ftGet('FT-2049'); ft.fallback.armed = !ft.fallback.armed; if(!ft.slipped) ft.note = ft.fallback.armed ? 'Fallback armed: NY air freight if PO-6120 slips' : 'Fallback off · no automatic air freight'; save(); break; }
    case 'fallbackModal': openModal('fallback', el); break;
    case 'toggleHotel': S.reviewOpen['FT-2049'] = !S.reviewOpen['FT-2049']; if(S.reviewOpen['FT-2049']){ if(S.drafts.hotel == null) S.drafts.hotel = HOTEL_DRAFT; U.focusNext = '#ta-hotel'; } else U.focusNext = '[data-primary]'; break;
    case 'sendHotel': hotelUpdate(S.drafts.hotel != null ? S.drafts.hotel : HOTEL_DRAFT); S.reviewOpen['FT-2049'] = false; U.focusNext = '[data-primary]'; break;
    case 'close': closeFt(arg); return;
    case 'ftMine': S.ui.ftMine = arg === '1'; save(); break;
    default: return;
  }
  render();
}
function ftReply(text){
  const ft = ftGet('FT-2045'); if(!ft || !String(text).trim()) return;
  ft.thread.push({from:'you', to:'rachel', at:S.clock, text:String(text).trim()});
  toast('Sent', {ok:true}); save();
}
function hotelUpdate(text){
  const ft = ftGet('FT-2049'); if(!ft) return;
  const t = stamp();
  (ft.updates || (ft.updates = [])).push({from:'you', to:'sofia', at:t, text:String(text || HOTEL_DRAFT).trim(), caption:'Sent to the hotel via Sofia R.'});
  ft.timeline.push({at:t, text:'Update sent to hotel via Sofia R.', state:'done'});
  S.drafts.hotel = null;
  toast('Sent', {ok:true}); save();
}

document.addEventListener('click', ev => {
  const t = ev.target;
  let dirty = false;
  if(U.filterOpen && !t.closest('.fpop') && !t.closest('[data-action="toggleFilters"]')){ U.filterOpen = false; dirty = true; }
  if(U.pickerFor && !t.closest('.opop') && !t.closest('[data-action="picker"]') && !t.closest('[data-action="secondary"]')){ U.pickerFor = null; dirty = true; }
  if(U.menuOpen && !t.closest('.menu') && !t.closest('[data-action="menu"]')){ U.menuOpen = false; dirty = true; }
  if(U.demoOpen && !t.closest('.demo') && !t.closest('[data-action="demo"]') && !t.closest('.modal')){ U.demoOpen = false; dirty = true; }
  const el = t.closest('[data-action]');
  if(el && !['SELECT','INPUT','TEXTAREA','LABEL'].includes(el.tagName) && !t.closest('label.nstep, label.chk')){
    if(el.tagName === 'A') ev.preventDefault();
    handle(el.dataset.action, el.dataset.arg, el, ev); return;
  }
  if(dirty) render();
});
document.addEventListener('submit', ev => { if(ev.target.dataset.form === 'login'){ ev.preventDefault(); doSignIn('pw'); } });
document.addEventListener('input', ev => {
  const el = ev.target;
  if(el.id === 'pw' && U.loginErr && el.value){ U.loginErr = ''; el.classList.remove('err'); el.removeAttribute('aria-invalid'); const m = document.getElementById('pw-err'); if(m) m.remove(); }
  if(el.dataset && el.dataset.draft){ S.drafts[el.dataset.draft] = el.value; save(); }
});
document.addEventListener('change', ev => {
  const el = ev.target, a = el.dataset.action;
  if(a === 'groupBy'){ S.ui.groupBy = el.value; S.ui.sort = null; }
  else if(a === 'grp') S.flow.groups[el.dataset.arg] = el.checked;
  else if(a === 'followUp') S.flow.followUp = el.checked;
  else if(a === 'speed') S.speed = +el.value;
  else if(a === 'ftFac') S.ui.ftFac = el.value;
  else if(a === 'step'){ const s = ftGet('FT-2045').nextSteps.find(x => x.key === el.dataset.arg); s.on = el.checked; s.status = el.checked ? 'ready' : 'skipped'; }
  else return;
  save(); render();
});
let gPending = 0;
document.addEventListener('keydown', ev => {
  const tgt = ev.target;
  const typing = ['INPUT','TEXTAREA','SELECT'].includes(tgt.tagName);
  if(ev.key === 'Escape'){
    if(U.modal){ closeModal(); render(); ev.preventDefault(); return; }
    if(U.pickerFor){ const id = U.pickerFor; U.pickerFor = null; U.focusNext = `[data-action="picker"][data-arg="${id}"]`; render(); ev.preventDefault(); return; }
    if(U.filterOpen){ U.filterOpen = false; U.focusNext = '[data-action="toggleFilters"]'; render(); ev.preventDefault(); return; }
    if(U.menuOpen || U.demoOpen){ U.menuOpen = false; U.demoOpen = false; U.focusNext = '[data-action="menu"]'; render(); ev.preventDefault(); return; }
    if(!typing && U.route.id){ handle('back'); ev.preventDefault(); return; }
  }
  if(U.pickerFor && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')){
    const opts = [...root.querySelectorAll('.opop .opt')];
    const i = opts.indexOf(document.activeElement);
    opts[ev.key === 'ArrowDown' ? (i + 1) % opts.length : (i - 1 + opts.length) % opts.length].focus(); ev.preventDefault(); return;
  }
  if(ev.key === 'Tab'){
    const pop = root.querySelector('.modal') || root.querySelector('.opop') || root.querySelector('.fpop');
    if(pop){
      const f = [...pop.querySelectorAll('button:not([disabled]),textarea,input,select')];
      if(f.length){
        if(!pop.contains(document.activeElement)){ f[0].focus(); ev.preventDefault(); return; }
        const first = f[0], last = f[f.length - 1];
        if(ev.shiftKey && document.activeElement === first){ last.focus(); ev.preventDefault(); }
        else if(!ev.shiftKey && document.activeElement === last){ first.focus(); ev.preventDefault(); }
      }
    }
  }
  if(ev.key === 'Enter' && tgt.id === 'composer'){ const v = tgt.value; S.drafts.composer = ''; tgt.value = ''; ask(v); ev.preventDefault(); return; }
  if(ev.key === 'Enter' && tgt.id === 'search'){
    const q = tgt.value.trim().toLowerCase(); if(!q) return;
    const hit = allRows(true).find(r => r.id.toLowerCase() === q || r.id.toLowerCase().replace('ex-', '') === q || r.sku.toLowerCase().includes(q));
    if(hit){ S.drafts.search = ''; nav('/exceptions/' + hit.id); } else toast('No match in this prototype');
    ev.preventDefault(); return;
  }
  if((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k'){ const s = document.getElementById('search'); if(s){ s.focus(); ev.preventDefault(); } return; }
  if(typing || !S.signedIn || U.modal || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if(ev.shiftKey && ev.key.toLowerCase() === 'd'){ U.demoOpen = !U.demoOpen; U.menuOpen = false; render(); ev.preventDefault(); return; }
  if(ev.key === '/'){
    if(!S.ui.panelOpen){ S.ui.panelOpen = true; save(); render(); }
    const c = document.getElementById('composer'); if(c) c.focus(); ev.preventDefault(); return;
  }
  if(gPending && Date.now() - gPending < 1200){
    gPending = 0;
    const map = {h:'/hub', e:'/exceptions', f:'/follow-through'};
    if(map[ev.key]){ nav(map[ev.key]); ev.preventDefault(); return; }
  }
  if(ev.key === 'g'){ gPending = Date.now(); }
});

/* =====================================================================
   Ticker: sim clock (1 min per 10 s), beats, toast expiry
   ===================================================================== */
let acc = 0, lastTick = Date.now();
setInterval(() => {
  const now = Date.now(), dt = now - lastTick; lastTick = now;
  if(!S.signedIn) return;
  let dirty = false;
  const due = S.beats.filter(b => b.fireAt <= now).sort((a, b) => a.fireAt - b.fireAt);
  if(due.length){ fireBeat(due[0].id, due[0].simAt); dirty = true; }
  if(!S.paused && document.visibilityState === 'visible'){
    acc += dt * S.speed;
    while(acc >= 10000){ acc -= 10000; S.clock += 1; dirty = true; }
  }
  if(U.toast && U.toast.until <= now){ save(); nextToast(); return; }
  if(U.demoOpen) dirty = true;
  if(dirty){
    save();
    const a = document.activeElement;
    if(a && a.tagName === 'SELECT') return;
    render();
  }
}, 1000);

/* Resume anything that was mid-animation when the page was reloaded */
if(S.flow.phase === 'verify'){ const c = calc(); S.flow.checks.forEach(ck => { ck.state = 'done'; ck.at = ck.at || S.clock; }); finishReroute(c); }
const f45 = ftGet('FT-2045');
if(f45 && f45.lane === 'in_motion' && f45.nextSteps.some(s => s.status !== 'done' && s.status !== 'skipped' && s.on)){
  f45.lane = 'needs_you'; f45.rec = 'esc'; f45.label = 'Escalation';
  f45.nextSteps.forEach(s => { if(s.status === 'checking') s.status = 'ready'; });
}
const f411 = ftGet('FT-2041.1');
if(f411 && f411.lane === 'in_motion'){ Object.assign(f411, {rec:'res', label:'Verified', steps:['done','done','done','done'], verifiedAt:S.clock, receipt:'6 crewnecks repicked from dock staging · all 32 customers now covered.', receiptShown:true}); f411.lane = 'verified'; patchEx('EX-2041.1', {rec:'res', statusLabel:'Found · verified', split:{res:6}, timeLeftOverride:`Done ${hm(S.clock)}`, isNew:false}); }

onRoute();
})();
</script>
